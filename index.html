<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-padding.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck-UI — DuckDB in your browser</title>
    <meta
      name="description"
      content="A fast, local-first DuckDB interface that runs entirely in your browser. Query CSV/Parquet/JSON, build charts, and share a link that reproduces the whole analysis — no backend, no signup."
    />

    <!-- Open Graph (Facebook, Slack, Discord, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Duck-UI" />
    <meta property="og:title" content="Duck-UI — DuckDB in your browser" />
    <meta
      property="og:description"
      content="Query data and build charts with DuckDB, entirely in your browser. Share a link that reproduces the whole analysis — no backend, no signup."
    />
    <meta property="og:url" content="https://duckui.com/" />
    <meta property="og:image" content="https://duckui.com/logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Duck-UI — DuckDB in your browser" />
    <meta
      name="twitter:description"
      content="Query data and build charts with DuckDB, entirely in your browser. Share a link that reproduces the whole analysis — no backend, no signup."
    />
    <meta name="twitter:image" content="https://duckui.com/logo.png" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Duck-UI",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "A local-first, browser-based DuckDB interface. Query CSV/Parquet/JSON, build charts, and share reproducible analyses with no backend.",
        "url": "https://duckui.com/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
