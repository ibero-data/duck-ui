<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" role="img" aria-label="Open in Duck-UI">
  <title>Open in Duck-UI</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="112" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="53" height="20" fill="#555"/>
    <rect x="53" width="59" height="20" fill="#f5c518"/>
    <rect width="112" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="275" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="430">Open in</text>
    <text x="275" y="140" transform="scale(.1)" fill="#fff" textLength="430">Open in</text>
    <text aria-hidden="true" x="815" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="490">Duck-UI</text>
    <text x="815" y="140" transform="scale(.1)" fill="#332b00" textLength="490">Duck-UI</text>
  </g>
</svg>
